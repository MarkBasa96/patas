<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Patas</title>
    <meta name="description" content="Who you owe, what is left, and what is due next." />
    <meta name="author" content="Joemark Basa" />
    <!-- Only Patas itself, its database (Supabase) and the bot check (Cloudflare Turnstile). QR pictures are
         shown from blob: URLs; the QR decoder needs WebAssembly. No eval, no plugins, no outside images. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Patas" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F6F6F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)" />
    <style id="expo-reset">
      :root { color-scheme: light dark; }
      html, body { height: 100%; background-color: #F6F6F3; }
      @media (prefers-color-scheme: dark) { html, body { background-color: #111318; } }
      body { overflow: hidden; }
      #root { display: flex; height: 100%; flex: 1; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
